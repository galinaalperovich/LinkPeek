<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkPeek hero banner</title>
    <!--
      Source of the banner at the top of the README. `SHOTS=1 npm run test:e2e`
      renders it at 1600x640 to hero-light.png and, with #dark in the address,
      to hero-dark.png. The screenshot on the right is a real one (summary-*.png).
    -->
    <style>
      :root {
        --bg-a: #fff8e8; --bg-b: #f6efe1; --fg: #1b1c1f; --muted: #5d6068; --accent: #f5a524;
        --frame: #ffffff; --frame-line: rgba(20, 22, 28, 0.12); --shadow: rgba(60, 40, 10, 0.28);
      }
      :root.dark {
        --bg-a: #1c1d22; --bg-b: #121316; --fg: #f1f1f3; --muted: #a3a7b1;
        --frame: #1f2024; --frame-line: rgba(255, 255, 255, 0.14); --shadow: rgba(0, 0, 0, 0.6);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1600px; height: 640px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 690px 1fr;
        align-items: center;
        background:
          radial-gradient(900px 520px at 88% 12%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
          linear-gradient(135deg, var(--bg-a), var(--bg-b));
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .copy { padding: 0 0 0 92px; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
      .brand img { width: 62px; height: 62px; }
      h1 { margin: 34px 0 22px; font-size: 72px; line-height: 1.03; letter-spacing: -0.035em; font-weight: 800; }
      h1 em { font-style: normal; color: color-mix(in srgb, var(--accent) 82%, var(--fg)); }
      p { margin: 0; max-width: 598px; color: var(--muted); font-size: 26px; line-height: 1.5; white-space: nowrap; }
      kbd {
        display: inline-block;
        padding: 0 13px;
        border: 2.5px solid var(--accent);
        border-bottom-width: 5px;
        border-radius: 10px;
        color: var(--fg);
        font: 700 0.92em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .facts { display: flex; gap: 9px; margin: 30px 0 0; padding: 0; list-style: none; }
      .facts li {
        padding: 6px 12px;
        border: 1.5px solid color-mix(in srgb, var(--fg) 22%, transparent);
        border-radius: 999px;
        color: var(--fg);
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
      }
      /* A browser-window frame around the real screenshot, running off the edge. */
      .shot {
        align-self: end;
        margin: 0 -40px 0 30px;
        height: 566px;
        border: 1px solid var(--frame-line);
        border-bottom: 0;
        border-radius: 22px 22px 0 0;
        background: var(--frame);
        box-shadow: 0 40px 90px -20px var(--shadow);
        overflow: hidden;
      }
      .bar { display: flex; gap: 9px; padding: 17px 20px; border-bottom: 1px solid var(--frame-line); }
      .bar i { width: 13px; height: 13px; border-radius: 50%; background: var(--frame-line); }
      .shot img { display: block; width: 100%; }
      .light-only { display: block; }
      .dark-only { display: none; }
      :root.dark .light-only { display: none; }
      :root.dark .dark-only { display: block; }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img src="../icons/icon.svg" alt="" />LinkPeek</div>
      <h1>Peek at any link.<br /><em>Keep your focus.</em></h1>
      <p>Every new tab breaks your concentration.<br />Hold <kbd>X</kbd>, click a link, read the gist in place.</p>
      <ul class="facts">
        <li>No key needed</li>
        <li>Zero dependencies</li>
        <li>Under 100 KB</li>
        <li>Open source</li>
      </ul>
    </section>
    <section class="shot">
      <div class="bar"><i></i><i></i><i></i></div>
      <img class="light-only" src="summary-light.png" alt="" />
      <img class="dark-only" src="summary-dark.png" alt="" />
    </section>
    <script>
      if (location.hash === '#dark') document.documentElement.classList.add('dark');
    </script>
  </body>
</html>
