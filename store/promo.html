<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkPeek promo tile</title>
    <!--
      Source for the Chrome Web Store promo images. Rendered at 440x280 (small
      tile) and 1400x560 (marquee) by `npm run store`. Everything scales with
      the viewport, so one file serves both sizes.
    -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5vw;
        background: #1b1c1f;
        color: #f4f4f1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      img { width: 30vh; height: 30vh; flex: none; }
      h1 { margin: 0; font-size: 13.5vh; line-height: 1; letter-spacing: -0.02em; }
      p { margin: 2.6vh 0 0; max-width: 46vw; color: #c9cad1; font-size: 6.4vh; line-height: 1.3; }
      kbd {
        padding: 0 0.35em;
        border: 0.12em solid #f5a524;
        border-radius: 0.3em;
        color: #f5a524;
        font: 600 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <img src="../icons/icon.svg" alt="" />
    <div>
      <h1>LinkPeek</h1>
      <p>Hold <kbd>X</kbd>, click a link, get the gist. Without leaving the page.</p>
    </div>
  </body>
</html>
